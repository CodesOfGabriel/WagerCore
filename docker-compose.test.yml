services:
  postgres-test:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: jungle_test
      POSTGRES_USER: jungle_test
      POSTGRES_PASSWORD: jungle_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jungle_test -d jungle_test"]
      interval: 2s
      timeout: 3s
      retries: 20
