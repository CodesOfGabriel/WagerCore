services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: jungle
      POSTGRES_USER: jungle
      POSTGRES_PASSWORD: jungle
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jungle -d jungle"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    entrypoint: ["/app/migrate"]
    command: ["up"]
    environment:
      DATABASE_URL: postgres://jungle:jungle@postgres:5432/jungle?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://jungle:jungle@postgres:5432/jungle?sslmode=disable
      HEALTH_TIMEOUT: ${HEALTH_TIMEOUT:-2s}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
    stop_grace_period: 20s

volumes:
  postgres_data:
