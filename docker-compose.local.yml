services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: jungle
      POSTGRES_USER: jungle
      POSTGRES_PASSWORD: jungle
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jungle -d jungle"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    entrypoint: ["/app/migrate"]
    command: ["up"]
    environment:
      DATABASE_URL: postgres://jungle:jungle@postgres:5432/jungle?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HOSTNAME: http://localhost:8081
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-admin
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx384m
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./deployments/keycloak/realm.json:/opt/keycloak/data/import/wagercore-realm.json:ro
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9000; printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; read -r response <&3; [[ $$response == *200* ]]'"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s

  localstack:
    image: localstack/localstack:4.4.0
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      SQS_ENDPOINT_STRATEGY: dynamic
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - ./deployments/localstack/init.sh:/etc/localstack/init/ready.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name integration-events.fifo >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    environment:
      APP_ENV: local
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://jungle:jungle@postgres:5432/jungle?sslmode=disable
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-10}
      HEALTH_TIMEOUT: ${HEALTH_TIMEOUT:-2s}
      WORKER_ROLES: ${WORKER_ROLES:-all}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      WORKER_INTERVAL: ${WORKER_INTERVAL:-200ms}
      DLQ_POLL_INTERVAL: ${DLQ_POLL_INTERVAL:-30s}
      LEASE_DURATION: ${LEASE_DURATION:-30s}
      SQS_VISIBILITY_TIMEOUT: ${SQS_VISIBILITY_TIMEOUT:-30}
      REFERENCE_TTL: ${REFERENCE_TTL:-10m}
      REFERENCE_MAX_ATTEMPTS: ${REFERENCE_MAX_ATTEMPTS:-10}
      RETRY_BASE: ${RETRY_BASE:-1s}
      OIDC_ISSUER_URL: http://localhost:8081/realms/wagercore
      OIDC_JWKS_URL: http://keycloak:8080/realms/wagercore/protocol/openid-connect/certs
      SQS_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
    stop_grace_period: 20s

volumes:
  postgres_data:
  keycloak_data:
